[project]
name = "runreviq"
version = "0.1.0"
description = "Local operational evidence prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.30,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
]
